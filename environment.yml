name: 11-genome-hgt-publication
channels:
  - conda-forge
  - defaults
  - bioconda
dependencies:
  - python=3.12
  - pandas>=2.0
  - numpy>=1.24
  - scipy>=1.11
  - matplotlib>=3.8
  - seaborn>=0.13
  - requests>=2.31
  - ipykernel>=6.0
  - nbformat>=4.2
  - tqdm>=4.65
  - gffutils>=0.12
  - statsmodels>=0.14
  - scikit-learn>=1.3.1
  - pyarrow>=14.0  # required by pandas for parquet I/O
  - pip
  - pip:
    - great_tables>=0.12
    - adjusttext>=0.8
    - plotly>=5.0
    - kaleido>=0.2.1  # static image export for the Figure 2 Sankey diagram
    - dendropy>=4.6
    - git+https://github.com/Pioneer-Research-Labs/pioneer-hgt-core.git@v1.0.0
